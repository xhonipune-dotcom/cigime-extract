name: Extract CIGIME-03 from EDCS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/extract_cigime03.py'
      - '.github/workflows/extract.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run extraction
        run: python scripts/extract_cigime03.py

      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/
          if git diff --cached --quiet; then
            echo 'No output changes.'
            exit 0
          fi
          git commit -m 'Update CIGIME-03 EDCS extract'
          git push
